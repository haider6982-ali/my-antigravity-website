<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#6ECEF5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3AAEE0;stop-opacity:1" />
    </radialGradient>
    <radialGradient id="sunGrad" cx="50%" cy="60%" r="50%">
      <stop offset="0%" style="stop-color:#FFD700" />
      <stop offset="60%" style="stop-color:#FFA500" />
      <stop offset="100%" style="stop-color:#FF6600" />
    </radialGradient>
    <linearGradient id="panelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1B3A6B" />
      <stop offset="50%" style="stop-color:#2C5F9E" />
      <stop offset="100%" style="stop-color:#1A2E5A" />
    </linearGradient>
    <linearGradient id="roofGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2A3A5A" />
      <stop offset="100%" style="stop-color:#1A2540" />
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4CAF50" />
      <stop offset="100%" style="stop-color:#1B5E20" />
    </linearGradient>
    <linearGradient id="leafGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#66BB6A" />
      <stop offset="100%" style="stop-color:#2E7D32" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-color="rgba(0,0,0,0.3)"/>
    </filter>
  </defs>

  <!-- Circular background -->
  <circle cx="200" cy="200" r="195" fill="url(#bgGrad)" />
  <circle cx="200" cy="200" r="185" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>

  <!-- Sun rays (behind house) -->
  <g transform="translate(235,125)" filter="url(#glow)">
    <!-- Sun body -->
    <circle cx="0" cy="0" r="52" fill="url(#sunGrad)" />
    <!-- Sun rays -->
    <g fill="#FF8C00" opacity="0.9">
      <polygon points="0,-68 5,-55 -5,-55" />
      <polygon points="0,-68 5,-55 -5,-55" transform="rotate(30)" />
      <polygon points="0,-68 5,-55 -5,-55" transform="rotate(60)" />
      <polygon points="0,-68 5,-55 -5,-55" transform="rotate(90)" />
      <polygon points="0,-68 5,-55 -5,-55" transform="rotate(120)" />
      <polygon points="0,-68 5,-55 -5,-55" transform="rotate(150)" />
      <polygon points="0,-68 5,-55 -5,-55" transform="rotate(180)" />
      <polygon points="0,-68 5,-55 -5,-55" transform="rotate(210)" />
      <polygon points="0,-68 5,-55 -5,-55" transform="rotate(240)" />
      <polygon points="0,-68 5,-55 -5,-55" transform="rotate(270)" />
      <polygon points="0,-68 5,-55 -5,-55" transform="rotate(300)" />
      <polygon points="0,-68 5,-55 -5,-55" transform="rotate(330)" />
    </g>
    <!-- Inner sun highlight -->
    <circle cx="-10" cy="-10" r="18" fill="#FFE066" opacity="0.5"/>
  </g>

  <!-- Green leaf arc (left side, going around bottom) -->
  <!-- Stem -->
  <path d="M 120 270 Q 115 200 148 148" stroke="url(#leafGrad)" stroke-width="10" fill="none" stroke-linecap="round"/>
  <!-- Left leaf -->
  <ellipse cx="113" cy="228" rx="30" ry="16" fill="url(#leafGrad)" transform="rotate(-35 113 228)"/>
  <line x1="113" y1="228" x2="126" y2="216" stroke="#1B5E20" stroke-width="1.5" opacity="0.6"/>
  <!-- Main large leaf -->
  <ellipse cx="103" cy="185" rx="38" ry="20" fill="url(#leafGrad2)" transform="rotate(-45 103 185)"/>
  <line x1="103" y1="185" x2="125" y2="163" stroke="#1B5E20" stroke-width="1.5" opacity="0.6"/>

  <!-- Bottom green arc (wrapping under the house) -->
  <path d="M 118 272 Q 200 320 285 270" stroke="url(#leafGrad)" stroke-width="11" fill="none" stroke-linecap="round" opacity="0.9"/>
  <!-- Shine on arc -->
  <path d="M 125 268 Q 200 315 278 267" stroke="rgba(255,255,255,0.25)" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- House walls (white) -->
  <rect x="148" y="210" width="120" height="75" rx="2" fill="white" filter="url(#shadow)"/>
  <!-- Window -->
  <rect x="183" y="220" width="28" height="28" rx="3" fill="#B8D4F0"/>
  <line x1="197" y1="220" x2="197" y2="248" stroke="#6A9AC4" stroke-width="1.5"/>
  <line x1="183" y1="234" x2="211" y2="234" stroke="#6A9AC4" stroke-width="1.5"/>
  <!-- Chimney -->
  <rect x="248" y="183" width="14" height="30" rx="2" fill="url(#roofGrad)"/>

  <!-- Roof -->
  <polygon points="138,213 208,163 278,213" fill="url(#roofGrad)" filter="url(#shadow)"/>
  <!-- Roof highlight -->
  <polygon points="138,213 208,163 278,213" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>

  <!-- Solar panels on roof (right side of roof) -->
  <g transform="translate(205,190) rotate(-28)">
    <!-- Panel background -->
    <rect x="0" y="0" width="75" height="50" rx="3" fill="url(#panelGrad)" />
    <!-- Panel grid lines -->
    <line x1="25" y1="0" x2="25" y2="50" stroke="#4A7AB5" stroke-width="1"/>
    <line x1="50" y1="0" x2="50" y2="50" stroke="#4A7AB5" stroke-width="1"/>
    <line x1="0" y1="17" x2="75" y2="17" stroke="#4A7AB5" stroke-width="1"/>
    <line x1="0" y1="33" x2="75" y2="33" stroke="#4A7AB5" stroke-width="1"/>
    <!-- Shine effect -->
    <rect x="2" y="2" width="20" height="12" rx="1" fill="rgba(255,255,255,0.12)"/>
    <rect x="27" y="2" width="20" height="12" rx="1" fill="rgba(255,255,255,0.08)"/>
    <rect x="52" y="2" width="20" height="12" rx="1" fill="rgba(255,255,255,0.12)"/>
    <!-- Highlight sparkle -->
    <circle cx="38" cy="15" r="4" fill="rgba(255,255,255,0.5)"/>
  </g>

  <!-- White outline border around the whole emblem -->
  <path d="M 120 270 Q 115 155 235 80" stroke="white" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.5"/>

  <!-- "DREAM" text -->
  <text x="200" y="325" font-family="Arial Black, Arial, sans-serif" font-size="52" font-weight="900" fill="#0B1B4D" text-anchor="middle" letter-spacing="2">
    DR<tspan fill="#2D8C2D">E</tspan>AM
  </text>

  <!-- "SOLAR ENERGY" text -->
  <text x="200" y="352" font-family="Arial Black, Arial, sans-serif" font-size="20" font-weight="900" fill="#0B1B4D" text-anchor="middle" letter-spacing="4">SOLAR ENERGY</text>

  <!-- Mobile number -->
  <text x="200" y="374" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#0B1B4D" text-anchor="middle" letter-spacing="1">MOBILE: 03202200884</text>
</svg>
